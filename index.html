<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Qual é a sua fuga?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Caveat:wght@500;600&display=swap">
<style>
/* Layout: app-like quiz column on warm paper, left-aligned bold headlines under a handwritten note, white option cards with a line icon and a check on the right, a flat green call to action. */
:root{
  --bg:#EFEBE5; --card:#FFFFFF; --card-line:#D8D1C6; --icon-bg:#F1ECE4; --track:#DDD6CB; --ink:#16140F; --text:#2F2C27; --soft:#77706A;
  --mark:#F7E08A; --gold:#A8854A; --green:#1E9E4F; --green-d:#157A3B; --on-green:#FFFFFF;
  --dark:#16140F; --on-dark:#F6F1E7; --alert:#FFF4D6; --alert-line:#E9C96A;
  --sans:'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --script:'Caveat', 'Segoe Print', 'Bradley Hand', cursive;
  color-scheme:light;
  --chess:'DejaVu Sans','Segoe UI Symbol','Apple Symbols',sans-serif;
}

html,body{ background:var(--bg); }
body{ color:var(--text); font-family:var(--sans); font-size:16.5px; line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); }
.wrap{ max-width:520px; margin:0 auto; padding-block:14px 56px; }
.bar{ height:8px; background:var(--track); border-radius:999px; overflow:hidden; margin:4px 0 28px; }
.bar i{ display:block; height:100%; width:0; background:var(--ink); border-radius:999px; transition:width .35s ease; }
.bar.hide{ visibility:hidden; }
.topbar{ display:flex; align-items:center; gap:10px; margin:4px 0 28px; }
.topbar .bar{ flex:1; margin:0; }
.backtop{ flex:0 0 auto; width:38px; height:38px; border-radius:50%; border:1.5px solid var(--card-line); background:var(--card); color:var(--ink); font-size:18px; font-weight:700; cursor:pointer; display:grid; place-items:center; }
.backtop:hover{ border-color:var(--ink); }
.backtop:focus-visible{ outline:3px solid var(--gold); outline-offset:2px; }
.backtop[hidden]{ display:none!important; }

h1,h2{ color:#2A2621; font-weight:800; line-height:1.18; letter-spacing:-.02em; text-align:left; margin:0 0 10px; text-wrap:balance; }
h1{ font-size:clamp(26px, 7vw, 32px); }
h2{ font-size:clamp(24px, 6.4vw, 29px); }
mark{ background:none; color:#000; padding:0; }
.sub{ text-align:left; color:var(--text); margin:0 0 20px; }
.hint{ text-align:left; font-size:14.5px; color:var(--soft); margin:0 0 16px; }
.check{ text-align:left; font-size:14.5px; color:var(--text); margin:0 0 18px; }
.kicker{ text-align:left; font-family:var(--script); font-size:23px; font-weight:600; line-height:1.1; color:var(--soft); margin:0 0 6px; }

.opts{ display:grid; gap:10px; }
.opt{ display:flex; gap:14px; align-items:center; width:100%; text-align:left; cursor:pointer;
  background:var(--card); color:var(--ink); border:1.5px solid var(--card-line); border-radius:16px; padding:12px 16px 12px 12px;
  font-family:var(--sans); font-size:16px; font-weight:600; line-height:1.35; transition:border-color .15s, transform .1s, box-shadow .15s; }
.opt:hover{ border-color:var(--ink); }
.opt:active{ transform:scale(.99); }
.opt.sel{ border-color:var(--ink); box-shadow:0 0 0 1px var(--ink) inset; }
.opt .ic{ flex:0 0 44px; height:44px; border-radius:10px; background:var(--icon-bg); display:grid; place-items:center; color:var(--ink); }
.opt .ic svg{ width:21px; height:21px; }
.opt .ck{ flex:0 0 24px; height:24px; margin-left:auto; border:1.5px solid #B9B1A5; border-radius:50%; display:grid; place-items:center; background:var(--card); color:#fff; }
.opt .ck.sq{ border-radius:7px; }
.opts.grid{ grid-template-columns:1fr 1fr; }
.opt.g{ position:relative; flex-direction:column; align-items:flex-start; gap:12px; padding:14px; }
.sub + .hint{ margin-top:-12px; }
.score{ text-align:center; margin:4px 0 14px; }
.score .sn{ font-size:clamp(64px, 20vw, 84px); font-weight:800; line-height:1; color:var(--ink); font-variant-numeric:tabular-nums; letter-spacing:-.03em; }
.score .sn small{ font-size:.3em; color:var(--soft); font-weight:700; margin-left:4px; letter-spacing:0; }
.score .sl{ display:inline-block; margin-top:10px; font-size:13px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:#fff; padding:6px 12px; border-radius:999px; }
.fig{ display:block; width:100%; max-width:340px; height:auto; margin:0 auto 14px; border-radius:16px; }
.fig .water{ animation:rise 1.8s cubic-bezier(.2,.7,.2,1) both; }
.fig .wv{ animation:drift 6s linear infinite; }
@keyframes rise{ from{ transform:translateY(190px); } }
@keyframes drift{ to{ transform:translateX(-40px); } }
@media (prefers-reduced-motion: reduce){ .fig .water, .fig .wv{ animation:none; } }
.regua{ position:relative; max-width:340px; margin:0 auto 18px; padding-top:4px; }
.regua .faixas{ display:flex; height:10px; border-radius:999px; overflow:hidden; }
.regua .faixas span{ flex:1; }
.regua .mk{ position:absolute; top:0; width:4px; height:18px; margin-left:-2px; background:var(--ink); border-radius:2px; box-shadow:0 0 0 2px var(--bg); }
.regua .rl{ display:flex; justify-content:space-between; font-size:11.5px; color:var(--soft); margin-top:6px; font-variant-numeric:tabular-nums; }
.lvtxt{ font-size:17px; color:var(--text); margin:0 0 18px; }
.hope{ background:#E7F4EC; border-left:4px solid var(--green); border-radius:10px; padding:14px 16px; margin:18px 0 26px; }
.hope p{ margin:0; }
.share{ background:var(--card); border-radius:14px; padding:18px; margin:26px 0 0; display:grid; gap:10px; }
.share h3{ margin:0; font-size:13px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); }
.share p{ margin:4px 0 0; font-size:15px; }
.btn.alt{ background:var(--card); color:var(--ink); border:1.5px solid var(--ink); box-shadow:none; }
.btn.alt:hover{ background:var(--icon-bg); }
.again30{ border:1.5px dashed var(--card-line); border-radius:14px; padding:14px 16px; margin:22px 0 0; font-size:15px; }
.again30 p{ margin:0; }
.lbl{ display:block; font-size:14px; font-weight:700; color:var(--ink); margin:18px 0 8px; }
.opt.chip{ justify-content:center; padding:14px 10px; font-weight:700; min-height:0; }
.chips{ display:flex; flex-wrap:wrap; gap:8px; }
.chips .opt.chip{ width:auto; flex:1 1 30%; }
.opts.grid .opt.g:last-child:nth-child(odd){ grid-column:span 2; }
.news{ background:var(--card); border:1.5px solid var(--card-line); border-radius:18px; overflow:hidden; }
.news .nimg, .brk .bimg, .pause .pimg{ display:block; width:100%; height:auto; max-height:260px; object-fit:cover; background:#F4F1EC; }
.news .nimg{ object-fit:contain; background:#F3EEE2; }
.news .nb{ padding:18px 20px 20px; }
.nmeta{ display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px; font-size:12.5px; color:var(--soft); font-weight:600; }
.nmeta .tag{ font-size:11.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; background:var(--ink); color:#fff; padding:5px 10px; border-radius:999px; }
.news .nh{ font-size:19px; line-height:1.3; font-weight:800; color:var(--ink); margin:12px 0 4px; text-wrap:balance; }
.news .num{ font-size:clamp(40px, 12vw, 52px); font-weight:800; color:var(--ink); line-height:1; margin:14px 0 8px; letter-spacing:-.02em; }
.news .num small{ font-size:.34em; font-weight:700; color:var(--soft); margin-left:8px; letter-spacing:0; }
.news .bt{ margin:0 0 10px; }
.news .src{ margin:0; font-size:13px; line-height:1.7; }
.news .src a{ color:var(--ink); font-weight:700; }
.brk.wimg{ padding:0; overflow:hidden; }
.brk.wimg .bb{ padding:18px 20px 22px; }
.brk.wimg .bimg{ max-height:260px; object-position:50% 30%; }
.pause .pimg{ border-radius:14px; margin:0 0 16px; max-height:none; }
.mk{ display:block; width:100%; max-width:340px; height:auto; margin:4px auto 18px; }
.bonus{ margin:26px 0 22px; }
.bonus h2{ margin-bottom:14px; }
.bi{ display:grid; grid-template-columns:118px 1fr; gap:14px; align-items:center; background:var(--card); border-radius:14px; padding:12px 14px; margin:0 0 10px; }
.bi img{ width:100%; height:auto; }
.bi > div{ min-width:0; }
.bi .bn{ font-size:11px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); }
.bi h3{ margin:2px 0 4px; font-size:16.5px; font-weight:800; color:var(--ink); }
.bi p{ margin:0; font-size:14px; line-height:1.45; }
.bi .bv{ margin-top:6px; font-size:14px; color:var(--soft); }
.bi .bv b{ color:var(--green-d); margin-left:4px; }
.price .tot{ margin:0 0 2px !important; font-size:14px; }
.price .hj{ margin:0 0 6px !important; font-size:14px; font-weight:700; color:var(--ink) !important; }
.price .px{ font-size:.42em; font-weight:800; color:var(--ink); margin-right:2px; }
.price .av{ font-size:16px !important; color:var(--text) !important; margin-top:10px !important; }
.intro .kicker{ font-size:21px; margin-bottom:4px; }
.intro h1{ font-size:clamp(25px, 7.4vw, 32px); margin-bottom:8px; }
.intro .sub{ font-size:16px; line-height:1.45; margin:0 0 16px; }
.intro .check{ text-align:center; font-size:13.5px; color:var(--soft); margin:10px 0 0; }
.opt.g .ic{ flex:none; width:42px; height:42px; }
.opt.g .ck{ position:absolute; top:12px; right:12px; margin:0; flex:none; width:22px; height:22px; }
.opt.g .t{ display:grid; gap:2px; padding-right:4px; }
.opt.g .t b{ font-size:16px; font-weight:800; color:var(--ink); }
.opt.g .t small{ font-size:13.5px; font-weight:500; color:var(--soft); line-height:1.35; }
.brk{ background:var(--card); border:1.5px solid var(--card-line); border-radius:18px; padding:22px 20px; }
.brk .tag{ display:inline-block; font-size:11.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; background:var(--ink); color:#fff; padding:5px 10px; border-radius:999px; }
.brk .num{ font-size:clamp(46px, 14vw, 60px); font-weight:800; color:var(--ink); line-height:1; margin:18px 0 6px; letter-spacing:-.03em; font-variant-numeric:tabular-nums; }
.brk .num small{ font-size:.32em; font-weight:700; color:var(--soft); margin-left:8px; letter-spacing:0; }
.brk .bt{ margin:0 0 10px; font-size:16px; color:var(--text); }
.brk .src{ margin:0; font-size:12.5px; color:var(--soft); }
.brk .src a{ color:var(--soft); }
.brk .bg{ font-family:var(--chess); font-size:44px; color:var(--gold); line-height:1; margin:16px 0 8px; font-variant-emoji:text; }
.brk .who{ font-family:var(--script); font-size:26px; font-weight:600; color:var(--ink); margin:0 0 8px; }
.brk h2{ margin-bottom:8px; }
.brk .fecho{ margin:12px 0 0; font-weight:800; color:var(--ink); font-size:17px; }
.ponte{ font-family:var(--script); font-size:23px; font-weight:600; line-height:1.25; color:var(--ink); margin:20px 4px 0; }
.opt .ck svg{ width:15px; height:15px; opacity:0; }
.opt.sel .ck{ background:var(--ink); border-color:var(--ink); }
.opt.sel .ck svg{ opacity:1; }
.opt .l{ flex:0 0 26px; height:26px; border:1.5px solid var(--ink); border-radius:6px; display:grid; place-items:center; font-size:12.5px; font-weight:700; color:var(--ink); background:var(--bg); }
.opt.sel .l{ background:var(--ink); color:var(--bg); }
.opt .e{ flex:0 0 auto; font-size:18px; }
.opt .t{ min-width:0; }
.opt:focus-visible, .btn:focus-visible, .link:focus-visible, textarea:focus-visible, input:focus-visible{ outline:3px solid var(--gold); outline-offset:2px; }

.btn{ display:flex; align-items:center; justify-content:center; width:100%; box-sizing:border-box; text-align:center; text-decoration:none; cursor:pointer;
  border:0; border-radius:16px; padding:18px; gap:10px; font-family:var(--sans); font-size:17px; font-weight:700; letter-spacing:0;
  background:var(--green); color:var(--on-green); box-shadow:none; transition:transform .08s, background .15s; }
.btn:hover{ background:var(--green-d); }
.btn:active{ transform:scale(.99); }
.btn[disabled]{ background:#A9DDBC; cursor:default; transform:none; }
.btn.dark{ background:var(--ink); color:var(--bg); box-shadow:0 4px 0 #000; }
.row{ margin-top:20px; display:grid; gap:10px; }
.link{ background:none; border:0; color:var(--soft); font-family:var(--sans); font-size:14px; cursor:pointer; padding:8px; justify-self:center; text-decoration:underline; text-underline-offset:3px; }
.back{ justify-self:start; text-decoration:none; }

textarea,input{ width:100%; box-sizing:border-box; border:1.5px solid var(--card-line); border-radius:16px; background:var(--card); color:var(--ink);
  font-family:var(--sans); font-size:16px; padding:14px; }
textarea{ min-height:110px; resize:vertical; }

/* intro */
.hero{ background:var(--dark); color:var(--on-dark); border-radius:16px; padding:26px 20px 22px; text-align:center; margin:22px 0 0; }
.hero .g{ font-family:var(--chess); font-size:52px; line-height:1; color:var(--gold); font-variant-emoji:text; }
.hero p{ margin:12px 0 0; font-size:15px; }
.hero .stats{ display:flex; justify-content:center; flex-wrap:wrap; gap:6px 14px; margin-top:14px; font-size:13px; color:#CFC6B8; }

/* pause screens */
.pause{ text-align:center; }
.pause h2, .loading h2{ text-align:center; }
.pause .g{ font-family:var(--chess); font-size:46px; line-height:1; color:var(--gold); margin-bottom:12px; font-variant-emoji:text; }
.pause p{ margin:0 0 14px; }
.pause .q{ font-size:19px; font-weight:700; color:var(--ink); line-height:1.4; }

/* loading */
.loading{ text-align:center; padding:30px 0; }
.loading .g{ font-family:var(--chess); font-size:46px; color:var(--gold); animation:pulse 1.2s ease-in-out infinite; font-variant-emoji:text; }
.loading ul{ list-style:none; padding:0; margin:16px 0 0; display:grid; gap:8px; }
.loading li{ font-size:14.5px; color:var(--soft); opacity:.35; transition:opacity .3s; }
.loading li.on{ opacity:1; color:var(--ink); }
.loading li.on::before{ content:"✓ "; color:var(--green); font-weight:700; }
@keyframes pulse{ 50%{ opacity:.45; } }

/* result + sales */
.pill{ display:block; width:max-content; margin:0 0 18px; font-size:12px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; padding:6px 12px; border-radius:999px; background:var(--ink); color:var(--bg); }
.recap{ background:var(--card); border-radius:14px; padding:18px; margin:0 0 18px; }
.recap p{ margin:0 0 8px; }
.recap p:last-child{ margin:0; }
.recap b{ color:var(--ink); }
.days{ text-align:center; background:var(--dark); color:var(--on-dark); border-radius:14px; padding:20px 16px; margin:0 0 18px; }
.days .n{ font-size:clamp(40px, 12vw, 52px); font-weight:800; line-height:1; font-variant-numeric:tabular-nums; color:var(--on-dark); }
.days .n small{ font-size:.38em; font-weight:600; color:var(--gold); margin-left:6px; }
.days p{ margin:10px 0 0; font-size:14.5px; color:#D6CEC1; }
.sec{ margin:22px 0; }
.sec h3{ font-size:13px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); margin:0 0 6px; }
.sec p{ margin:0 0 10px; }
.warn{ background:var(--alert); border:1.5px solid var(--alert-line); border-radius:12px; padding:14px 16px; margin:22px 0; font-size:15px; }
.warn p{ margin:0; }
.first{ border:1.5px solid var(--ink); border-radius:14px; padding:18px; margin:22px 0; }
.first h3{ margin:0 0 6px; font-size:13px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--ink); }
.first p{ margin:0; }
.divider{ height:1px; background:var(--card-line); margin:32px 0 26px; }
.cover{ display:block; width:62%; max-width:240px; margin:6px auto 22px; border-radius:6px; box-shadow:0 14px 30px rgba(0,0,0,.18), 0 2px 6px rgba(0,0,0,.12); }
.list{ list-style:none; padding:0; margin:0 0 22px; display:grid; gap:10px; }
.list li{ display:flex; gap:10px; align-items:flex-start; }
.list li::before{ content:"✅"; flex:0 0 auto; }
.list span{ min-width:0; }
.price{ border:2px solid var(--green); border-radius:16px; overflow:hidden; margin:0 0 18px; text-align:center; }
.price .top{ background:var(--green); color:var(--on-green); font-size:12.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; padding:9px; }
.price .body{ padding:18px 14px 20px; }
.price .v{ font-size:44px; font-weight:800; color:var(--ink); line-height:1; font-variant-numeric:tabular-nums; }
.price .v small{ font-size:.45em; vertical-align:top; margin-right:4px; }
.price p{ margin:8px 0 0; font-size:14px; color:var(--soft); }
.guarantee{ display:flex; gap:14px; align-items:flex-start; background:var(--card); border-radius:14px; padding:16px; margin:18px 0; }
.guarantee .s{ flex:0 0 52px; height:52px; border-radius:50%; border:2px solid var(--gold); display:grid; place-items:center; font-weight:800; color:var(--gold); font-size:13px; line-height:1.05; text-align:center; }
.guarantee p{ margin:0; font-size:14.5px; }
.guarantee b{ color:var(--ink); }
.contact{ text-align:center; font-size:13.5px; color:var(--soft); margin:14px 0 0; display:flex; flex-wrap:wrap; gap:6px 8px; justify-content:center; align-items:center; }
.contact b{ color:var(--ink); user-select:all; }
.copy{ background:none; border:1px solid var(--card-line); border-radius:999px; padding:4px 10px; font-family:var(--sans); font-size:12px; color:var(--soft); cursor:pointer; }
.small{ font-size:12.5px; color:var(--soft); text-align:center; line-height:1.5; margin:24px 0 0; }
.fade{ animation:in .3s ease both; }
@keyframes in{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:none; } }
@media (prefers-reduced-motion: reduce){ .fade, .loading .g{ animation:none; } .bar i{ transition:none; } }
/* compacto para celular */

.gar .selo{ flex:0 0 84px; height:84px; border-radius:50%; background:var(--green); color:#fff; display:grid; place-content:center; text-align:center; line-height:1; box-shadow:0 0 0 4px #E7F4EC, 0 0 0 6px var(--green); }
.gar .selo b{ font-size:34px; font-weight:900; display:block; }
.gar .selo small{ font-size:11px; font-weight:800; letter-spacing:.08em; }

.opt .ic svg{ width:18px; height:18px; }
.opt .ck{ flex-basis:22px; height:22px; }
.opt.g{ gap:8px; padding:11px; }
.opt.g .ic{ width:36px; height:36px; }
.opt.g .t b{ font-size:15px; }

.btn{ padding-block:15px; }

.news .nb{ padding:14px 16px 16px; }
.news .nh{ font-size:16.5px; margin:10px 0 2px; }

function bind(q){

  ${estopim ? `<div class="sec"><h3>O seu momento</h3><p>Você chegou até aqui porque ${esc(estopim)}. Esse incômodo é um aviso de xeque: ainda há saída, mas pede uma jogada agora.</p></div>` : ""}

  ${tentou ? `<div class="sec"><h3>O que você já tentou</h3><p>${tentou}</p></div>` : ""}

  ${relogio ? `<div class="warn"><p>⚠️ <b>Atenção: o Relógio Parado.</b> Suas respostas também mostram a fuga que está por trás de todas: deixar para depois. No xadrez, o tempo também é uma peça. Cada mês de adiamento é uma peça entregue sem perceber.</p></div>` : ""}

  <div class="first"><h3>♟ Sua primeira jogada (48 horas)</h3><p>${esc(f.jog)}</p></div>

  <div class="autor"><p class="kicker">Quem sou eu</p>
    ${VIDEO_URL ? (/youtu/.test(VIDEO_URL) ? `<div class="vid"><iframe src="https://www.youtube.com/embed/${(VIDEO_URL.match(/(?:v=|youtu\.be\/|shorts\/|embed\/)([\w-]{11})/) || [])[1] || ""}" title="Vídeo de apresentação de Magdiel Negrão" allow="encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>` : `<video class="vid" src="${esc(VIDEO_URL)}" controls playsinline preload="metadata"></video>`) : FOTO_AUTOR ? `<img class="fa" src="${esc(FOTO_AUTOR)}" alt="Magdiel Negrão">` : `<video class="loop" src="${img("autorv")}" poster="${img("autor")}" autoplay muted loop playsinline aria-label="Magdiel Negrão sentado numa poltrona, num escritório com livros e um tabuleiro de xadrez"></video>`}

    <p>Sou psicanalista e professor de xadrez. No tabuleiro, aprendi que ninguém vence uma partida fugindo dela: o relógio continua correndo e as peças continuam no mesmo lugar.</p>
    <p>Foi juntando as duas coisas que criei o método das 5 jogadas, um jeito simples de olhar para os problemas como um grande mestre olha para o tabuleiro: com calma, com estratégia e uma jogada de cada vez.</p>
    <p class="ig">Instagram <b>@mag.dhel</b></p>
  </div>
  <div class="divider"></div>

  <p class="kicker">${alto ? "Para afiar o que você já faz bem" : "O método completo"}</p>
  <h2>${alto ? "Você já joga bem. <mark>O método te ajuda a decidir ainda melhor.</mark>" : "A primeira jogada tira você do lugar. <mark>O método vira o jogo.</mark>"}</h2>
  <img class="mk main" src="${img("mk-ebook")}" alt="Mockup do e-book A Decisão de 100 Milhões, de Magdiel Negrão">
  <p class="sub"><b>A Decisão de 100 Milhões</b> é o método em cinco jogadas, inspirado na forma como os grandes mestres do xadrez decidem, para você parar de fugir e começar a resolver.</p>
  <ul class="list">
    <li><span><b>As 5 jogadas do método:</b> Admitir, Analisar, Avaliar, Agir e Aprender e Recomeçar.</span></li>
    <li><span><b>As 5 fugas mais comuns</b>, incluindo a sua, e como sair de cada uma.</span></li>
    <li><span><b>Exercícios práticos</b> em todos os capítulos e a página de trabalho “Minha partida”.</span></li>
    <li><span><b>“Como um grande mestre decide”</b>: uma pergunta-chave para cada etapa.</span></li>
    <li><span><b>As histórias de Ana, Roberto e Marina</b>, em que você vai se reconhecer.</span></li>
    <li><span><b>O dicionário do xadrez para a vida</b>, para entender tudo mesmo sem saber jogar.</span></li>
  </ul>
  <div class="bonus"><p class="kicker">E você ainda leva</p><h2><mark>${BONUS.length} bônus</mark> de cortesia</h2>
    ${BONUS.map((b, k) => `<div class="bi"><img src="${img(b.img)}" alt="Mockup do bônus ${esc(b.nome)}" loading="lazy"><div><span class="bn">Bônus ${k + 1}</span><h3>${esc(b.nome)}</h3><p>${esc(b.desc)}</p><p class="bv"><s>${dinC(b.valor)}</s> <b>Cortesia</b></p></div></div>`).join("")}
  </div>
  ${URGENCIA.ativo ? `<div class="urg">⏳ <b>${esc(URGENCIA.texto)}</b>: só para os <b>${URGENCIA.vagas} primeiros</b>${URGENCIA.ate ? ` até <b>${esc(URGENCIA.ate)}</b>` : ""}.</div>` : ""}
  <div class="stack" id="oferta">
    <img class="pack" src="${img("pack")}" alt="O pacote completo: e-book, materiais de apoio e bônus">
    <h3 class="st">Tudo o que você recebe hoje</h3>
    <div class="it"><span>📘 <b>E-book</b> A Decisão de 100 Milhões</span><em>${din(PRECO_NUM)}</em></div>
    ${BONUS.map(b => `<div class="it"><span>🎁 ${esc(b.nome)}</span><em><s>${din(b.valor)}</s> <i>Grátis</i></em></div>`).join("")}
    <div class="tt">Valor total separado: <s class="nw">${dinC(PRECO_NUM + BONUS.reduce((a, b) => a + b.valor, 0))}</s></div>
    <p class="hj">Hoje, por apenas</p>
    ${PARCELAS ? `<div class="pv"><span class="px">${PARCELAS}x<br>de</span><span class="cur">${MOEDA}</span><span class="big">${PARCELA}</span></div>
    <p class="av">ou <b>${dinC(PRECO_NUM)}</b> à vista · acesso imediato</p>` : `<div class="pv"><span class="cur">${MOEDA}</span><span class="big">${dinC(PRECO_NUM).replace(MOEDA + " ", "")}</span></div>
    <p class="av">pagamento único · acesso imediato</p>`}
    <div class="gar"><div class="selo"><b>7</b><small>DIAS</small></div><div><h4>Garantia total de 7 dias</h4><p>Leia, faça os exercícios. Se não valer, você pede e recebe <b>100% do seu dinheiro de volta</b>. Seu risco: <b>${dinC(0)}</b>.</p></div></div>
    <a ${buyAttrs}>Quero o e-book + ${BONUS.length} bônus${ARROW}</a>
    ${prova()}
  </div>
  ${!alto && !naoQuer ? `<div class="sec"><h3>Quer ir além?</h3><p>Pela sua nota, talvez você queira fazer isso com alguém do lado. Quem compra o e-book pode entrar na lista de espera para uma <b>sessão de diagnóstico</b> comigo. As vagas por semana são limitadas.</p></div>` : ""}
  <a ${buyAttrs}>Quero começar minha nova partida</a>
  ${prova()}
  <p class="contact">Dúvidas? Fale comigo no WhatsApp <b id="num">${WHATS_SHOW}</b><button class="copy" id="copyNum" type="button">Copiar número</button></p>
  <div class="again30"><p>📅 <b>Refaça o teste em 30 dias.</b> Use o método por 30 dias e volte aqui: veja quanto a água baixou.</p></div>
  <div class="share"><h3>Compartilhe</h3>
    <a class="btn alt" href="https://wa.me/?text=${encodeURIComponent(`Fiz o teste "Qual é a sua fuga?" e a minha nota foi ${n}/100 (${L.nome}). Faz o seu e me conta a sua nota!` + (link ? `\n${link}` : ""))}" target="_blank" rel="noopener">Compartilhar a minha nota</a>
    <p>Conhece alguém que vive adiando a vida? Envie este teste para essa pessoa.</p>
    <a class="btn alt" href="https://wa.me/?text=${encodeURIComponent(`Lembrei de você. Fiz um teste rápido, de 3 minutos, que mostra o que a gente faz quando um problema aparece: resolve ou foge. Achei muito bom, faz e me conta!` + (link ? `\n${link}` : ""))}" target="_blank" rel="noopener">Enviar o teste para alguém</a>
  </div>
  <p class="small">Este é um teste de autoconhecimento e não substitui uma avaliação profissional. Se você estiver vivendo um sofrimento intenso, ou sentir que uma fuga saiu do seu controle, procure também um profissional de saúde ou um serviço de apoio.</p>
  <div class="row"><button class="link" id="again" type="button">Refazer o teste</button></div>`;
}

$("backTop").addEventListener("click", () => { if (i > 0) { i--; render(); } });
render();
</script>
